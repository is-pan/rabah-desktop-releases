name: Sync latest release to R2

on:
  release:
    types: [published, released, prereleased, edited]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-latest-desktop-release-to-r2
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: rabah-desktop-downloads
      DOWNLOAD_BASE_URL: https://download.rabah.ai

    steps:
      - name: Check out release metadata repository
        uses: actions/checkout@v4

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            pipx install awscli
          fi
          aws --version

      - name: Sync highest complete semantic version
        shell: bash
        run: bash scripts/sync-latest-release-to-r2.sh
